<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Samosbor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1a1a2e;
        }
        
        #canvas-container {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
        }
        
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #1a1a2e;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #eee;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            z-index: 100;
        }
        
        #loading h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: #16c79a;
        }
        
        #progress-container {
            width: 300px;
            height: 20px;
            background: #0f3460;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 1rem;
        }
        
        #progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #16c79a, #11999e);
            transition: width 0.3s ease;
        }
        
        #status {
            font-size: 0.9rem;
            color: #aaa;
        }
        
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div id="loading">
        <h1>Samosbor</h1>
        <div id="progress-container">
            <div id="progress-bar"></div>
        </div>
        <div id="status">Loading...</div>
    </div>
    
    <div id="canvas-container">
        <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
    </div>

    <script type="text/javascript">
        var Module = {
            preRun: [],
            postRun: [],
            print: function(text) {
                console.log(text);
            },
            printErr: function(text) {
                console.error(text);
            },
            canvas: (function() {
                var canvas = document.getElementById('canvas');
                canvas.addEventListener('webglcontextlost', function(e) {
                    alert('WebGL context lost. Please reload the page.');
                    e.preventDefault();
                }, false);
                return canvas;
            })(),
            setStatus: function(text) {
                var statusElement = document.getElementById('status');
                var progressBar = document.getElementById('progress-bar');
                
                if (!text) {
                    document.getElementById('loading').classList.add('hidden');
                    return;
                }
                
                var match = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
                if (match) {
                    var progress = (parseInt(match[2]) / parseInt(match[4])) * 100;
                    progressBar.style.width = progress + '%';
                    statusElement.textContent = match[1].trim();
                } else {
                    statusElement.textContent = text;
                }
            },
            totalDependencies: 0,
            monitorRunDependencies: function(left) {
                this.totalDependencies = Math.max(this.totalDependencies, left);
                Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')' : '');
            }
        };
        
        Module.setStatus('Downloading...');

        function resizeCanvasToViewport() {
            var canvas = Module.canvas;
            if (!canvas) return;
            var width = window.innerWidth || document.documentElement.clientWidth || document.body.clientWidth;
            var height = window.innerHeight || document.documentElement.clientHeight || document.body.clientHeight;
            canvas.style.width = width + 'px';
            canvas.style.height = height + 'px';
            canvas.width = width;
            canvas.height = height;
        }

        window.addEventListener('resize', resizeCanvasToViewport);
        window.addEventListener('orientationchange', resizeCanvasToViewport);
        resizeCanvasToViewport();
        
        window.onerror = function(event) {
            Module.setStatus('Error: ' + event);
        };
    </script>
    {{{ SCRIPT }}}
</body>
</html>
